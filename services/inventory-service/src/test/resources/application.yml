spring:
  datasource:
    url: jdbc:tc:postgresql:15:///test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      properties:
        isolation.level: read_committed
