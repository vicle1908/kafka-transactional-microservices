---
spring:
  datasource:
    url: jdbc:tc:postgresql:15:///test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  autoconfigure:
    exclude:
      - com.example.common.cache.RedisCacheAutoConfiguration
  cache:
    type: simple
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: false
    # spring.flyway.locations: classpath:db/migration
