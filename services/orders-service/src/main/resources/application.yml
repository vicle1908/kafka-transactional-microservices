---
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${ORDERS_DB_NAME:orders}}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:com/example/persistence/db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://${SCHEMA_REGISTRY_HOST:localhost}:${SCHEMA_REGISTRY_PORT:8081}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      enable-idempotence: true
      acks: all
      retries: 2147483647
      transaction-id-prefix: ${ORDERS_KAFKA_TX_PREFIX:orders-tx-}
    consumer:
      group-id: orders-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      isolation-level: read_committed

orders:
  grpc:
    port: ${ORDERS_GRPC_PORT:9090}
    shutdown-grace-period: PT5S

outbox:
  publisher: cdc
  transaction:
    default-timeout: 30

logging:
  level:
    com.example: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.apache.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      cache: true

# Temporal configuration
spring.temporal:
  connection:
    target: ${TEMPORAL_TARGET:localhost:7233}
  workers-auto-discovery:
    packages:
      - com.example.orders
  start-workers: true

# OpenTelemetry configuration
otel:
  service:
    name: orders-service
  endpoint: ${OTEL_ENDPOINT:localhost:4317}
  enabled: ${OTEL_ENABLED:true}
