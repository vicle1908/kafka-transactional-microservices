---
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATIONS_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATIONS_DB_NAME:notifications}}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      enable-idempotence: true
      acks: all
      retries: 2147483647
      transaction-id-prefix: ${NOTIFICATION_KAFKA_TX_PREFIX:notifications-tx-}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      isolation-level: read_committed
  transaction:
    default-timeout: 30

logging:
  level:
    com.example: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.apache.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      cache: true

notification:
  retry:
    delay: 300000  # 5 minutes

outbox:
  publisher: cdc

# OpenTelemetry configuration
otel:
  service:
    name: notification-service
  endpoint: ${OTEL_ENDPOINT:localhost:4317}
  enabled: ${OTEL_ENABLED:true}
