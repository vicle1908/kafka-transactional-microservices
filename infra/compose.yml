---
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.1}
    container_name: kafka
    profiles:
      - local
      - services
    ports:
      - "${KAFKA_PLAINTEXT_PORT:-9092}:9092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # EOS configuration: Transaction state log replication for exactly-once semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # EOS configuration: Idempotence settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE:-confluentinc/cp-schema-registry:7.9.5}
    container_name: schema-registry
    profiles:
      - local
      - services
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.1-alpine}
    container_name: postgres
    profiles:
      - local
      - migrate
      - services
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB_ORDERS:-orders}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB_ORDERS:-orders}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:8.4.0-alpine}
    container_name: redis
    profiles:
      - local
      - services
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  debezium-connect:
    image: ${DEBEZIUM_IMAGE:-quay.io/debezium/connect:3.3}
    container_name: debezium-connect
    profiles:
      - local
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 5

  akhq:
    image: ${AKHQ_IMAGE:-tchiotludo/akhq:0.26.0}
    container_name: akhq
    profiles:
      - local
    depends_on:
      - kafka
      - schema-registry
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            microservices:
              properties:
                bootstrap.servers: kafka:9092
                schema.registry.url: http://schema-registry:8081
    ports:
      - "${AKHQ_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ui"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway-orders:
    image: ${FLYWAY_IMAGE:-flyway/flyway:11.18.0}
    container_name: flyway-orders
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/orders-service/src/main/resources/db/migration:/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/orders
      -user=${POSTGRES_USER:-app}
      -password=${POSTGRES_PASSWORD:-app}
      -locations=filesystem:/migrations
      -baselineOnMigrate=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      migrate

  flyway-payments:
    image: ${FLYWAY_IMAGE:-flyway/flyway:11.18.0}
    container_name: flyway-payments
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/payments-service/src/main/resources/db/migration:/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/payments
      -user=${POSTGRES_USER:-app}
      -password=${POSTGRES_PASSWORD:-app}
      -locations=filesystem:/migrations
      -baselineOnMigrate=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      migrate

  flyway-inventory:
    image: ${FLYWAY_IMAGE:-flyway/flyway:11.18.0}
    container_name: flyway-inventory
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/inventory-service/src/main/resources/db/migration:/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/inventory
      -user=${POSTGRES_USER:-app}
      -password=${POSTGRES_PASSWORD:-app}
      -locations=filesystem:/migrations
      -baselineOnMigrate=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      migrate

  flyway-notification:
    image: ${FLYWAY_IMAGE:-flyway/flyway:11.18.0}
    container_name: flyway-notification
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/notification-service/src/main/resources/db/migration:/migrations:ro
    # Use plural notifications DB to match application.yml defaults and env-reference
    command: >
      -url=jdbc:postgresql://postgres:5432/${NOTIFICATIONS_DB_NAME:-notifications}
      -user=${POSTGRES_USER:-app}
      -password=${POSTGRES_PASSWORD:-app}
      -locations=filesystem:/migrations
      -baselineOnMigrate=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      migrate

  # ELK Stack for centralized logging
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.2.1}
    container_name: elasticsearch
    profiles:
      - local
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: ${LOGSTASH_IMAGE:-docker.elastic.co/logstash/logstash:9.2.1}
    container_name: logstash
    profiles:
      - local
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:9.1.3}
    container_name: kibana
    profiles:
      - local
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  filebeat:
    image: ${FILEBEAT_IMAGE:-docker.elastic.co/beats/filebeat:9.2.1}
    container_name: filebeat
    profiles:
      - local
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/usr/share/filebeat/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "filebeat", "test", "config"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    container_name: prometheus
    profiles:
      - local
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.3.0}
    container_name: grafana
    profiles:
      - local
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  # OpenTelemetry Collector and Jaeger for distributed tracing
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.140.0}
    container_name: otel-collector
    profiles:
      - local
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC receiver
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP receiver
      - "${OTEL_HEALTH_PORT:-13133}:13133"  # Health check
    depends_on:
      - jaeger

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.75.0}
    container_name: jaeger
    profiles:
      - local
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # Jaeger UI
      - "${JAEGER_GRPC_PORT:-14250}:14250"  # gRPC server
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ============================================
  # Microservices
  # ============================================

  orders-service:
    build:
      context: ../services/orders-service
      dockerfile: Dockerfile.local
    image: orders-service:latest
    container_name: orders-service
    profiles:
      - services
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "${ORDERS_SERVICE_PORT:-8080}:8080"
      - "${ORDERS_GRPC_PORT:-9091}:9091"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      ORDERS_DB_NAME: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDERS_GRPC_PORT: 9091
      TEMPORAL_TARGET: temporal:7233
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile.local
    image: payments-service:latest
    container_name: payments-service
    profiles:
      - services
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8084}:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      PAYMENTS_DB_NAME: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_TARGET: temporal:7233
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile.local
    image: inventory-service:latest
    container_name: inventory-service
    profiles:
      - services
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "${INVENTORY_SERVICE_PORT:-8085}:8083"
      - "${INVENTORY_GRPC_PORT:-9094}:9094"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      INVENTORY_DB_NAME: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INVENTORY_GRPC_PORT: 9094
      TEMPORAL_TARGET: temporal:7233
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile.local
    image: notification-service:latest
    container_name: notification-service
    profiles:
      - services
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      NOTIFICATIONS_DB_NAME: notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_TARGET: temporal:7233
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Temporal Workflow Orchestration
  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.29.1}
    container_name: temporal
    profiles:
      - services
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-app}
      - POSTGRES_SEEDS=postgres
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.43.3}
    container_name: temporal-ui
    profiles:
      - services
    depends_on:
      - temporal
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000

volumes:
  kafka-data:
  pg-data:
  redis-data:
  elasticsearch-data:
