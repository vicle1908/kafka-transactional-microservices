# Redis minimal configuration for production overlay
# This file is deliberately minimal; use managed Redis if possible.
# Uncomment and tune as needed.

# bind 0.0.0.0
# protected-mode yes
# requirepass <set-via-secret>
# masterauth <set-via-secret>
# tls-port 6379
# tls-cert-file /etc/redis/tls/tls.crt
# tls-key-file /etc/redis/tls/tls.key
# tls-ca-cert-file /etc/redis/tls/ca.crt

# Persistence (disabled for ephemeral cache)
# save ""
# appendonly no

# Memory
# maxmemory 256mb
# maxmemory-policy allkeys-lru
