version: 2
updates:
  # Gradle (multi-module)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      gradle-plugins:
        patterns:
          - "io.gitlab.arturbosch.detekt*"
          - "com.diffplug.spotless*"
          - "com.github.ben-manes.versions*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dockerfiles (root and each service)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/temporal-pilot"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/orders-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/payments-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/inventory-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"

  # npm at repo root (for docs tooling or scripts if present)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
