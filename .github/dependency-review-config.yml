# Dependency Review Configuration
# This file configures the GitHub Dependency Review Action

# Block pull requests that introduce vulnerable dependencies
fail-on-severity: high

# Block pull requests that introduce dependencies with unacceptable licenses
deny-licenses:
  - AGPL-1.0
  - AGPL-3.0
  - CC-BY-NC-1.0
  - CC-BY-NC-2.0
  - CC-BY-NC-4.0
  - GPL-1.0
  - GPL-2.0
  - GPL-3.0

# License allowlist removed to avoid conflict with deny-licenses.
# Keep deny-licenses only to prevent conflicts with the action's schema.

# Configuration for dependency groups
dependency-groups:
  # Core framework dependencies
  - name: core-framework
    dependencies:
      - org.springframework.*
      - org.jetbrains.kotlin.*
    licenses:
      - Apache-2.0
    severity-threshold: critical

  # Testing dependencies
  - name: testing
    dependencies:
      - org.junit.*
      - org.testcontainers.*
      - org.mockito.*
    licenses:
      - Apache-2.0
      - MIT
    severity-threshold: high

  # Build tool dependencies
  - name: build-tools
    dependencies:
      - com.github.davidmc24.gradle.plugin.avro
      - io.gitlab.arturbosch.detekt
      - org.jlleitschuh.gradle.ktlint
    licenses:
      - Apache-2.0
      - MIT
    severity-threshold: high