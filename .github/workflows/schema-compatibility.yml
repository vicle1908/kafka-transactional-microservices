name: Schema Compatibility

on:
  push:
    paths:
      - 'common-events-avro/**'
      - 'gradle/deps.versions.toml'
      - '.github/workflows/schema-compatibility.yml'
  pull_request:
    paths:
      - 'common-events-avro/**'

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/deps.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Export Avro schemas
        run: ./gradlew --configuration-cache exportAvroSchemas
      - name: Validate schema compilation
        run: ./gradlew --configuration-cache schemaCompatibilityCheck
