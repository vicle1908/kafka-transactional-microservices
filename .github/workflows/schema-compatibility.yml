---
# yamllint disable rule:line-length
name: Schema Compatibility

"on":
  push:
    paths:
      - 'common-events-avro/**'
      - 'gradle/deps.versions.toml'
      - '.github/workflows/schema-compatibility.yml'
  pull_request:
    paths:
      - 'common-events-avro/**'

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - name: Set up JDK 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Export Avro schemas
        run: ./gradlew --configuration-cache exportAvroSchemas
      - name: Validate schema compilation
        run: ./gradlew --configuration-cache schemaCompatibilityCheck
