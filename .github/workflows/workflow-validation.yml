---
# yamllint disable rule:line-length
name: Workflow Validation

"on":
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color -verbose \
            .github/workflows/*.yml

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Debug file structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          echo "GitHub workflows directory:"
          ls -la .github/workflows/
          echo "Yamllint config exists:"
          if [ -f .yamllint ]; then echo "Found .yamllint"; cat .yamllint; else echo "No .yamllint found"; fi

      - name: Run yamllint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            cytopia/yamllint \
            -c .yamllint \
            .github/workflows
