name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Gradle version check
        run: ./gradlew --no-daemon --stacktrace --configuration-cache versionCheck

      - name: Schema compatibility
        run: ./gradlew --no-daemon --stacktrace --configuration-cache schemaCompatibilityCheck

      - name: Build & Test
        run: ./gradlew --no-daemon --stacktrace --configuration-cache clean check

      - name: Kotlin Lint
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace ktlintCheck

      - name: Detekt
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace detektAll --no-configuration-cache

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Markdown lint
        run: markdownlint "docs/**/*.md"

      - name: Validate runbook links
        run: |
          echo "Validating runbook links..."
          # Add link validation here when needed

      - name: Check for orphaned runbooks
        run: |
          echo "Checking for orphaned runbooks..."
          # Add orphaned file check here when needed
