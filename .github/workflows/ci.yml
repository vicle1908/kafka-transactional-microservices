name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        continue-on-error: true
        id: gradle-wrapper-validation
        with:
          min-wrapper-count: 1
          allow-snapshots: false
      
      - name: Fallback Gradle wrapper validation
        if: steps.gradle-wrapper-validation.outcome == 'failure'
        run: |
          echo "Network validation failed, checking wrapper files locally..."
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "✅ Gradle wrapper files found"
            echo "Wrapper version: $(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"
          else
            echo "❌ Gradle wrapper files missing"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Gradle version check
        run: ./gradlew --no-daemon --stacktrace --configuration-cache versionCheck

      - name: Schema compatibility
        run: ./gradlew --no-daemon --stacktrace --configuration-cache schemaCompatibilityCheck
        timeout-minutes: 10

      - name: Build & Test
        run: ./gradlew --no-daemon --stacktrace --configuration-cache clean check
        timeout-minutes: 20

      - name: Kotlin Lint
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace ktlintCheck

      - name: Detekt
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace detektAll --no-configuration-cache

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Markdown lint
        run: markdownlint "docs/**/*.md"

      - name: Validate runbook links
        run: |
          echo "Validating runbook links..."
          # Add link validation here when needed

      - name: Check for orphaned runbooks
        run: |
          echo "Checking for orphaned runbooks..."
          # Add orphaned file check here when needed
