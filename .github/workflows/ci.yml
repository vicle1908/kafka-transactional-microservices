---
# yamllint disable rule:line-length
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70
        id: gradle-wrapper-validation
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Set up JDK 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Gradle version check
        run: ./gradlew --no-daemon --stacktrace --configuration-cache versionCheck

      - name: Schema compatibility
        run: ./gradlew --no-daemon --stacktrace --configuration-cache schemaCompatibilityCheck

      - name: Build & Test
        run: ./gradlew --no-daemon --stacktrace --configuration-cache clean check

      - name: Kotlin Lint
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace ktlintCheck

      - name: Detekt
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace detektAll --no-configuration-cache

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Markdown lint
        run: markdownlint "docs/**/*.md"

      - name: Validate runbook links
        run: |
          echo "Validating runbook links..."
          # Add link validation here when needed

      - name: Check for orphaned runbooks
        run: |
          echo "Checking for orphaned runbooks..."
          # Add orphaned file check here when needed
