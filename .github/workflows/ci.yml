name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/deps.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Gradle version check
        run: ./gradlew --configuration-cache versionCheck
      - name: Schema compatibility
        run: ./gradlew --configuration-cache schemaCompatibilityCheck
      - name: Build & Test
        run: ./gradlew --configuration-cache check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Markdown lint
        run: markdownlint "docs/**/*.md"
      - name: Validate runbook links
        run: |
          echo "Validating runbook links..."
          # Add link validation here when needed
      - name: Check for orphaned runbooks
        run: |
          echo "Checking for orphaned runbooks..."
          # Add orphaned file check here when needed