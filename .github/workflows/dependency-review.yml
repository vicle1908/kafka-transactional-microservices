name: Dependency Review

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lightweight GitHub-native dependency review (no build)
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
          warn-only: true
          deny-identified-vulnerabilities: true

      - name: Upload version catalog for context
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-version-catalog
          path: gradle/libs.versions.toml
