name: Dependency Review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/deps.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Generate dependency report
      - name: Generate dependencies report
        run: |
          ./gradlew dependencies --configuration compileClasspath > dependencies-compile.txt
          ./gradlew dependencies --configuration runtimeClasspath > dependencies-runtime.txt
          ./gradlew :common-events:dependencies > dependencies-common-events.txt
          ./gradlew :common-kafka:dependencies > dependencies-common-kafka.txt
          ./gradlew :common-persistence:dependencies > dependencies-common-persistence.txt
          ./gradlew :common-sagas:dependencies > dependencies-common-sagas.txt
          ./gradlew :common-events-avro:dependencies > dependencies-common-events-avro.txt
          ./gradlew :common-proto:dependencies > dependencies-common-proto.txt
          ./gradlew :common-temporal:dependencies > dependencies-common-temporal.txt
          ./gradlew :services:orders-service:dependencies > dependencies-orders-service.txt
          ./gradlew :services:payments-service:dependencies > dependencies-payments-service.txt
          ./gradlew :services:inventory-service:dependencies > dependencies-inventory-service.txt
          ./gradlew :services:notification-service:dependencies > dependencies-notification-service.txt

      # Dependency review action
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
          deny-licenses: "AGPL-1.0, AGPL-3.0, CC-BY-NC-1.0, CC-BY-NC-2.0, CC-BY-NC-4.0, GPL-1.0, GPL-2.0, GPL-3.0"
          allow-licenses: "Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, CC-BY-4.0, MPL-2.0"
          deny-identified-vulnerabilities: true

      # Upload dependency reports
      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            dependencies-*.txt
            gradle/deps.versions.toml