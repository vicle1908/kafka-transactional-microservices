name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  versions:
    uses: ./.github/workflows/central-versions.yml

  integration-test:
    needs: versions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      kafka:
        image: apache/kafka:4.1.0
        options: --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
            schema-registry:
              image: confluentinc/cp-schema-registry:7.7.0
              env:
                SCHEMA_REGISTRY_HOST_NAME: localhost
                SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
                SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://localhost:9092
                SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
              options: --health-cmd "curl -f http://localhost:8081/subjects || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
              ports:
                - 8081:8081
              depends_on:
                - kafka
            debezium:
              image: debezium/connect:3.3
              environment:
                BOOTSTRAP_SERVERS: localhost:9092
                GROUP_ID: 1
                CONFIG_STORAGE_TOPIC: debezium_config
                OFFSET_STORAGE_TOPIC: debezium_offsets
                STATUS_STORAGE_TOPIC: debezium_status
                KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
                VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
                KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://localhost:8081
                VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://localhost:8081
                INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
                INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
              ports:
                - 8083:8083
              depends_on:
                - kafka
                - schema-registry
      
          steps:
            - uses: actions/checkout@${{ needs.versions.outputs.actions_checkout_version }}
            - name: Set up JDK 25
              uses: actions/setup-java@${{ needs.versions.outputs.actions_setup_java_version }}
              with:
                distribution: 'temurin'
                java-version: '25'
                cache: 'gradle'
            - name: Validate Gradle Wrapper
              uses: gradle/actions/wrapper-validation@${{ needs.versions.outputs.gradle_actions_wrapper_validation_version }}
            - name: Wait for services to be ready
              run: |
                echo "Waiting for services to be ready..."
                sleep 30
                curl -f http://localhost:8083/
            - name: Run integration tests with EOS validation
              run: |
                echo "Running integration tests with full Kafka/DB environment..."
                ./gradlew :common-persistence:integrationTest \
                          -Dspring.profiles.active=test \
                          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/test
                ./gradlew :common-kafka:integrationTest \
                          -Dspring.profiles.active=test \
                          -Dkafka.bootstrap.servers=localhost:9092
                ./gradlew :orders-service:integrationTest \
                          -Dspring.profiles.active=test \
                          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/test \
                          -Dkafka.bootstrap.servers=localhost:9092
            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@${{ needs.versions.outputs.actions_checkout_version }}
              with:
                name: integration-test-results
                path: '**/build/reports/**'
      