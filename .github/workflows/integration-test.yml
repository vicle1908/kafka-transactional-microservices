---
# yamllint disable rule:line-length
name: Integration Tests

"on":
  push:
    branches: [main, ci/**]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      kafka:
        image: apache/kafka:4.1.0
        options: --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      schema-registry:
        image: confluentinc/cp-schema-registry:7.7.0
        env:
          SCHEMA_REGISTRY_HOST_NAME: localhost
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://localhost:9092
          SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
        options: --health-cmd "curl -f http://localhost:8081/subjects || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 8081:8081
      debezium:
        image: debezium/connect:3.3
        env:
          BOOTSTRAP_SERVERS: localhost:9092
          GROUP_ID: 1
          CONFIG_STORAGE_TOPIC: debezium_config
          OFFSET_STORAGE_TOPIC: debezium_offsets
          STATUS_STORAGE_TOPIC: debezium_status
          KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
          VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
          INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
          INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        ports:
          - 8083:8083

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70

      - name: Set up JDK 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          curl -f http://localhost:8083/

      - name: Run integration tests with EOS validation
        run: |
          echo "Running integration tests with full Kafka/DB environment..."
          ./gradlew --no-daemon --stacktrace --configuration-cache :common-persistence:integrationTest \
                    -Dspring.profiles.active=test \
                    -Dspring.datasource.url=jdbc:postgresql://localhost:5432/test
          ./gradlew --no-daemon --stacktrace --configuration-cache :common-kafka:integrationTest \
                    -Dspring.profiles.active=test \
                    -Dkafka.bootstrap.servers=localhost:9092
          ./gradlew --no-daemon --stacktrace --configuration-cache :orders-service:integrationTest \
                    -Dspring.profiles.active=test \
                    -Dspring.datasource.url=jdbc:postgresql://localhost:5432/test \
                    -Dkafka.bootstrap.servers=localhost:9092

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-test-results
          path: '**/build/reports/**'
