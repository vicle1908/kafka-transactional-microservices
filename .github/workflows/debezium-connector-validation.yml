---
name: Debezium Connector Validation

on:
  push:
    paths:
      - 'infra/debezium/connectors/**'
      - 'infra/compose.yml'
      - '.github/workflows/debezium-connector-validation.yml'
  pull_request:
    paths:
      - 'infra/debezium/connectors/**'

jobs:
  validate-connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test infrastructure
        run: |
          docker compose -f infra/compose.yml up -d kafka debezium-connect
          echo "Waiting for Debezium Connect to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:8083/connectors; do sleep 2; done'

      - name: Validate connector configurations
        run: |
          CONNECTORS_DIR="infra/debezium/connectors"
          DEBEZIUM_URL="http://localhost:8083"
          FAILED=0

          for connector_file in "$CONNECTORS_DIR"/*.json; do
            if [ ! -f "$connector_file" ]; then
              echo "No connector files found in $CONNECTORS_DIR"
              continue
            fi

            connector_name=$(jq -r '.name' "$connector_file")
            echo "Validating connector: $connector_name"

            response=$(curl -s -w "\n%{http_code}" -X PUT \
              "$DEBEZIUM_URL/connectors/$connector_name/config" \
              -H "Content-Type: application/json" \
              -d @"$connector_file")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Connector $connector_name registered successfully (HTTP $http_code)"
            else
              echo "❌ Connector $connector_name registration failed (HTTP $http_code)"
              echo "Response: $body"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "One or more connector registrations failed"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          docker compose -f infra/compose.yml down -v

