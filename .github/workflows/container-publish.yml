name: Container Publishing

on:
  push:
    tags:
      - 'v*.*.*'  # Push events to matching v*.*.* tags
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  versions:
    uses: ./.github/workflows/central-versions.yml

  build-and-push:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders-service, payments-service, inventory-service, notification-service, temporal-pilot]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ needs.versions.outputs.actions_checkout_version }}

      - name: Set up JDK 25
        uses: actions/setup-java@${{ needs.versions.outputs.actions_setup_java_version }}
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@${{ needs.versions.outputs.docker_metadata_action_version }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{tag}}
            type=raw,value={{sha}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@${{ needs.versions.outputs.docker_setup_buildx_action_version }}

      - name: Log in to the Container registry
        uses: docker/login-action@${{ needs.versions.outputs.docker_login_action_version }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle packages
        uses: actions/cache@${{ needs.versions.outputs.actions_cache_version }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/deps.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR for ${{ matrix.service }}
        run: |
          echo "Building JAR for ${{ matrix.service }}"
          ./gradlew :services:${{ matrix.service }}:bootJar --no-daemon

      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@${{ needs.versions.outputs.docker_build_push_action_version }}
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            JAR_FILE=services/${{ matrix.service }}/build/libs/${{ matrix.service }}-0.1.0-SNAPSHOT.jar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@${{ needs.versions.outputs.aquasecurity_trivy_action_version }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          exit-code: '0'  # Don't fail the build on vulns
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@${{ needs.versions.outputs.actions_checkout_version }}
        if: always()
        with:
          name: trivy-scan-results-${{ matrix.service }}
          path: trivy-results-${{ matrix.service }}.sarif'