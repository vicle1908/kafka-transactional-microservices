---
# yamllint disable rule:line-length
name: Load Testing

"on":
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3 AM run
  workflow_dispatch:  # Allow manual trigger
    inputs:
      load_level:
        description: 'Load test level'
        required: true
        default: 'medium'
        type: choice
        options:
          - light
          - medium
          - heavy
      duration:
        description: 'Test duration in minutes'
        required: true
        default: '10'
        type: string

env:
  LOAD_TEST_DURATION: ${{ github.event.inputs.duration || '10' }}
  LOAD_LEVEL: ${{ github.event.inputs.load_level || 'medium' }}

jobs:
  load-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: load-test  # Use specific environment for load testing

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit

      - name: Set up JDK 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Validate infrastructure files exist
        run: |
          # Ensure required infrastructure files exist
          if [ ! -f "infra/compose.test.yml" ]; then
            echo "❌ Missing infra/compose.test.yml"
            exit 1
          fi
          if [ ! -f "infra/otel/otel-collector-config.yaml" ]; then
            echo "❌ Missing infra/otel/otel-collector-config.yaml"
            exit 1
          fi
          echo "✅ All required infrastructure files found"

      - name: Start test infrastructure
        run: |
          echo "🚀 Starting test infrastructure..."

          # Start a test environment with Kafka, PostgreSQL, and services
          docker compose -f infra/compose.test.yml up -d

          # Enhanced health checks with proper timeouts
          echo "⏳ Waiting for infrastructure services to be ready..."

          # Wait for PostgreSQL
          echo "📊 Waiting for PostgreSQL to be ready..."
          timeout 120 bash -c 'until docker compose -f infra/compose.test.yml exec -T postgres-test pg_isready -U app -d test &>/dev/null; do sleep 5; done' || {
            echo "❌ PostgreSQL failed to start within timeout"
            docker compose -f infra/compose.test.yml logs postgres-test
            exit 1
          }

          # Wait for Kafka
          echo "📡 Waiting for Kafka to be ready..."
          timeout 180 bash -c 'until docker compose -f infra/compose.test.yml exec -T kafka-test kafka-broker-api-versions --bootstrap-server localhost:9092 &>/dev/null; do sleep 10; done' || {
            echo "❌ Kafka failed to start within timeout"
            docker compose -f infra/compose.test.yml logs kafka-test
            exit 1
          }

          # Wait for Schema Registry
          echo "📋 Waiting for Schema Registry to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:8081/subjects &>/dev/null; do sleep 5; done' || {
            echo "❌ Schema Registry failed to start within timeout"
            docker compose -f infra/compose.test.yml logs schema-registry-test
            exit 1
          }

          # Wait for Debezium Connect
          echo "🔄 Waiting for Debezium Connect to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:8083/ &>/dev/null; do sleep 5; done' || {
            echo "❌ Debezium Connect failed to start within timeout"
            docker compose -f infra/compose.test.yml logs debezium-connect-test
            exit 1
          }

          echo "✅ All infrastructure services are ready"

      - name: Build services with Gradle
        run: |
          echo "🔨 Building services..."

          # Build all services
          ./gradlew clean build -x test --no-daemon

          # Build Docker images for all services
          ./gradlew :orders-service:bootBuildImage --imageName=orders-service:test --no-daemon
          ./gradlew :payments-service:bootBuildImage --imageName=payments-service:test --no-daemon

          # Build other services only if they exist
          if [ -d "services/inventory-service" ]; then
            ./gradlew :inventory-service:bootBuildImage --imageName=inventory-service:test --no-daemon
          fi
          if [ -d "services/notification-service" ]; then
            ./gradlew :notification-service:bootBuildImage --imageName=notification-service:test --no-daemon
          fi

          echo "✅ All services built successfully"

      - name: Run database migrations
        run: |
          echo "🗄️ Running database migrations..."

          # Run Flyway migrations for each service
          services=("orders" "payments" "inventory" "notification")

          for service in "${services[@]}"; do
            if [ -d "services/${service}-service/src/main/resources/db/migration" ]; then
              echo "Running migrations for ${service} service..."
              docker run --rm \
                --network "$(docker compose -f infra/compose.test.yml ps -q kafka-test | head -1 | cut -d'-' -f1)" \
                -v "$(pwd)/services/${service}-service/src/main/resources/db/migration:/migrations:ro" \
                flyway/flyway:latest \
                -url=jdbc:postgresql://postgres-test:5432/test \
                -user=app \
                -password=app \
                -locations=filesystem:/migrations \
                -connectRetries=60 \
                migrate || echo "⚠️ Migrations for ${service} may have already been applied"
            fi
          done

          echo "✅ Database migrations completed"

      - name: Create services compose override
        run: |
          echo "📝 Creating services compose override..."
          bash scripts/loadtest/make-compose-override.sh
          cat > infra/compose.loadtest.yml <<'YAML'
          version: "3.9"

          services:
            orders-service:
              image: orders-service:test
              container_name: orders-service-loadtest
              environment:
                - SPRING_PROFILES_ACTIVE=test
                - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/test
                - SPRING_DATASOURCE_USERNAME=app
                - SPRING_DATASOURCE_PASSWORD=app
                - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
                - SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL=http://schema-registry-test:8081
                - MANAGEMENT_OTLP_ENDPOINT=http://otel-collector:4317
                - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
                - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
              depends_on:
                postgres-test:
                  condition: service_healthy
                kafka-test:
                  condition: service_healthy
                schema-registry-test:
                  condition: service_healthy
              ports:
                - "8081:8080"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 60s
              volumes:
                - ./logs:/app/logs
              deploy:
                resources:
                  limits:
                    cpus: '1.0'
                    memory: 1G
                  reservations:
                    cpus: '0.5'
                    memory: 512M

            payments-service:
              image: payments-service:test
              container_name: payments-service-loadtest
              environment:
                - SPRING_PROFILES_ACTIVE=test
                - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/test
                - SPRING_DATASOURCE_USERNAME=app
                - SPRING_DATASOURCE_PASSWORD=app
                - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
                - SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL=http://schema-registry-test:8081
                - MANAGEMENT_OTLP_ENDPOINT=http://otel-collector:4317
                - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
                - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
              depends_on:
                postgres-test:
                  condition: service_healthy
                kafka-test:
                  condition: service_healthy
                schema-registry-test:
                  condition: service_healthy
              ports:
                - "8082:8080"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 60s
              volumes:
                - ./logs:/app/logs
              deploy:
                resources:
                  limits:
                    cpus: '1.0'
                    memory: 1G
                  reservations:
                    cpus: '0.5'
                    memory: 512M

          YAML

      - name: Create Prometheus config
        run: |
          echo "📝 Creating Prometheus config..."
          bash scripts/loadtest/make-prometheus.sh

      - name: Start services with Docker Compose
        run: |
          # shellcheck disable=SC2086
          echo "🚀 Starting microservices..."

          # Start the services
          docker compose -f infra/compose.test.yml -f infra/compose.loadtest.yml up -d orders-service payments-service

          # Wait for services to be ready with enhanced monitoring
          services=("orders-service:8081" "payments-service:8082")

          for service in "${services[@]}"; do
            service_name=$(echo "$service" | cut -d':' -f1)
            port=$(echo "$service" | cut -d':' -f2)

            echo "⏳ Waiting for ${service_name} to be ready on port ${port}..."
            # shellcheck disable=SC2086
            timeout 300 bash -c "until curl -f http://localhost:${port}/actuator/health &>/dev/null; do sleep 10; done" || {
              echo "❌ ${service_name} failed to start within timeout"
          docker compose -f infra/compose.test.yml -f infra/compose.loadtest.yml logs "${service_name}"
              exit 1
            }

            # Additional health check
            health=$(curl -s "http://localhost:${port}/actuator/health" | jq -r '.status // "unknown"')
            echo "✅ ${service_name} is ready (status: ${health})"
          done

          echo "✅ All services are ready"

      - name: Install k6
        run: |
          echo "📦 Installing k6..."
          curl -L https://github.com/grafana/k6/releases/download/v0.48.0/k6-v0.48.0-linux-amd64.tar.gz | tar -xzf -
          sudo cp k6-v0.48.0-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Create k6 load test scripts
        run: |
          echo "📝 Creating k6 load test scripts..."
          LOAD_TEST_DURATION=${{ env.LOAD_TEST_DURATION }} LOAD_LEVEL=${{ env.LOAD_LEVEL }} bash scripts/loadtest/make-k6-scripts.sh

      - name: Validate k6 scripts
        run: |
          echo "🔍 Validating k6 scripts..."
          k6 run --dry-run load-tests/health-check.js || exit 1
          k6 run --dry-run load-tests/microservices-load-test.js || exit 1
          echo "✅ k6 scripts validated successfully"

      - name: Run health check before load test
        run: |
          echo "🏥 Running pre-load test health checks..."
          k6 run --vus 1 --iterations 5 load-tests/health-check.js

      - name: Monitor outbox table depth (baseline)
        run: |
          echo "📊 Establishing baseline outbox metrics..."

          # Check if outbox tables exist and get baseline counts
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT 'outbox' as table_name, COUNT(*) as count
            FROM information_schema.tables
            WHERE table_name = 'outbox' AND table_schema = 'public';
          " 2>/dev/null || echo "Outbox table not found"

          # Count pending messages if outbox exists
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT 'pending_messages' as metric, COUNT(*) as count
            FROM outbox
            WHERE status = 'PENDING' OR status IS NULL;
          " 2>/dev/null || echo "Could not query pending messages"

      - name: Run k6 load test
        run: |
          echo "🚀 Starting k6 load test..."
          echo "Load level: $LOAD_LEVEL"
          echo "Duration: $LOAD_TEST_DURATION minutes"

          # Run the load test and capture results
          k6 run \
            --out json=load-results.json \
            --out csv=load-results.csv \
            --summary-trend-stats="min,med,avg,max,p(90),p(95),p(99)" \
            --summary-export=load-summary.json \
            load-tests/microservices-load-test.js

          echo "✅ Load test completed"

      - name: Monitor outbox table depth (post-load)
        run: |
          echo "📊 Analyzing post-load outbox metrics..."

          # Check outbox table depth after load test
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT
              'outbox_depth' as metric,
              COUNT(*) as count,
              COUNT(CASE WHEN status = 'PENDING' OR status IS NULL THEN 1 END) as pending,
              COUNT(CASE WHEN status = 'PROCESSED' THEN 1 END) as processed
            FROM outbox;
          " 2>/dev/null || echo "Could not query outbox metrics"

          # Check for any failed processing
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT
              'failed_messages' as metric,
              COUNT(*) as count
            FROM outbox
            WHERE status = 'FAILED' OR (retry_count > 3 AND status != 'PROCESSED');
          " 2>/dev/null || echo "Could not query failed messages"

      - name: Validate EOS behavior under load
        run: |
          echo "🔍 Validating Exactly-Once Semantics under load..."

          # Check for duplicate order IDs in database (would indicate EOS violations)
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT
              'duplicate_check' as metric,
              COUNT(*) as total_orders,
              COUNT(DISTINCT order_id) as unique_orders,
              COUNT(*) - COUNT(DISTINCT order_id) as duplicates
            FROM orders;
          " 2>/dev/null || echo "Could not validate EOS behavior"

          # Check processed events ledger for duplicates
          docker compose -f infra/compose.test.yml exec -T postgres-test psql -U app -d test -c "
            SELECT
              'processed_events_check' as metric,
              COUNT(*) as total_processed,
              COUNT(DISTINCT event_id) as unique_events,
              COUNT(*) - COUNT(DISTINCT event_id) as duplicate_processing
            FROM processed_events;
          " 2>/dev/null || echo "Could not validate processed events"

      - name: Generate comprehensive load test report
        run: |
          echo "📋 Generating comprehensive load test report..."
          LOAD_TEST_DURATION=${{ env.LOAD_TEST_DURATION }} LOAD_LEVEL=${{ env.LOAD_LEVEL }} RUNNER_OS=${{ runner.os }} \
            GITHUB_REF_NAME=${{ github.ref_name }} GITHUB_SHA=${{ github.sha }} \
            bash scripts/loadtest/make-load-report.sh

      - name: Upload load test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: load-test-results
          path: |
            reports/
            load-results.json
            load-results.csv
            load-summary.json
          retention-days: 30

      - name: Upload Docker logs if failed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: docker-logs
          path: |
            logs/
            /var/lib/docker/containers/
          retention-days: 7

      - name: Cleanup test infrastructure
        if: always()
        run: |
          echo "🧹 Cleaning up test infrastructure..."

          # Stop all services
          docker compose -f infra/compose.test.yml -f infra/compose.loadtest.yml down -v --remove-orphans

          # Clean up Docker resources
          docker system prune -f --volumes || true

          # Clean up local files
          rm -rf k6-* load-results.* load-summary.* || true

          echo "✅ Cleanup completed"
