[versions]
kotlin = "2.2.21"
spring-boot = "4.0.0"
spring-dependency-management = "1.1.7"
spring-kafka = "4.0.0"
flyway = "11.16.0"
junit = "6.0.1"
h2 = "2.4.240"
junit-platform-launcher = "6.0.1"
detekt = "1.23.8"
ktlint-plugin = "14.0.1"
ktlint-cli = "1.7.1"
avro = "1.12.1"
avro-plugin = "1.9.1"
jackson-core = "3.0.2"
# Jackson 2.x for backward compatibility with libraries that haven't migrated to Jackson 3.x (e.g., Temporal SDK)
jackson2 = "2.18.4"
commons-compress = "1.28.0"
kotlinx-serialization = "1.9.0"
mockito-kotlin = "5.4.0"
awaitility = "4.3.0"
protobuf = "4.33.1"
protobuf-plugin = "0.9.5"
grpc = "1.77.0"
grpc-kotlin = "1.5.0"
protoc = "4.33.1"
protoc-gen-grpc-java = "1.77.0"
protoc-gen-grpc-kotlin = "1.5.0"
javax-annotation = "3.0.0"
temporal = "1.32.1"
temporal-spring-boot-starter = "1.32.1"
opentelemetry = "1.56.0"
okhttp = "5.2.1"
kafka = "4.1.1"
testcontainers = "2.0.2"
postgresql = "42.7.8"
mockk = "1.14.6"
assertj = "3.27.6"
# Spring Retry - explicit version since Spring Boot 4.0 no longer manages it
spring-retry = "2.0.11"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avro-plugin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }

[libraries]
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson-core" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson-core" }
# jackson-datatype-jsr310 is built into jackson-databind in Jackson 3.x - no separate module needed
# Jackson 2.x libraries for backward compatibility with libraries that haven't migrated (e.g., Temporal SDK)
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson2-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2" }
jackson2-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test", version.ref = "spring-kafka" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref = "spring-boot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj", version.ref = "spring-boot" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version.ref = "spring-boot" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junit-platform-launcher" }
junit-platform-commons = { module = "org.junit.platform:junit-platform-commons", version.ref = "junit-platform-launcher" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "protoc-gen-grpc-java" }
protoc-gen-grpc-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "protoc-gen-grpc-kotlin" }
javax-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "javax-annotation" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
# temporal-shaded bundles gRPC, Protobuf, and Guava to avoid version conflicts with project dependencies
temporal-shaded = { module = "io.temporal:temporal-shaded", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
temporal-spring-boot-starter = { module = "io.temporal:temporal-spring-boot-starter", version.ref = "temporal-spring-boot-starter" }
temporal-opentracing = { module = "io.temporal:temporal-opentracing", version.ref = "temporal" }
temporal-opentelemetry = { module = "io.temporal:temporal-opentelemetry-alpha", version.ref = "temporal" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-opentracing-shim = { module = "io.opentelemetry:opentelemetry-opentracing-shim" }
opentelemetry-extension-kotlin = { module = "io.opentelemetry.instrumentation:opentelemetry-kotlin-1.0" }
opentelemetry-instrumentation-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry.exporter:opentelemetry-exporter-otlp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
spring-retry = { module = "org.springframework.retry:spring-retry", version.ref = "spring-retry" }
