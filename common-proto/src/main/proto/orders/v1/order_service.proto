syntax = "proto3";

package orders.v1;

option java_package = "com.example.orders.proto";
option java_multiple_files = true;

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message CustomerInfo {
  string customer_id = 1;
  string customer_name = 2;
  string email = 3;
  string phone = 4;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}

message CreateOrderRequest {
  string request_id = 1;
  CustomerInfo customer = 2;
  repeated OrderItem items = 3;
  Address shipping_address = 4;
  Address billing_address = 5;
}

message OrderStatus {
  string order_id = 1;
  string status = 2;
  string message = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  string message = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  string order_id = 1;
  CustomerInfo customer = 2;
  repeated OrderItem items = 3;
  Address shipping_address = 4;
  Address billing_address = 5;
  string status = 6;
  double total_amount = 7;
  int64 created_at = 8;
}

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
}